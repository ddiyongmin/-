    const attendees=attendeesForIdxs(App.people,idxs).map(p=>({name:p.name,title:p.title}));
    room.confirmed={date,start,end,attendees};
    await Store.setRoom(App.code,room);
    closeSheet();render();
    if(!getConfetti(App.code).confirmed){setConfettiFlag(App.code,'confirmed');fireConfetti();}
    toast(wasConfirmed?'일정을 변경했어요 ✅':'일정을 확정했어요 🎉');
  },
  toggleReqPerson:(el)=>{ el.classList.toggle('on'); },
  sheetSettings:()=>{
    askPassword(()=>{openSettingsSheet();});
  }
};
/* 참고 순위나 직접 선택으로 일정을 확정하는 내부 함수 */
async function doConfirmInternal(w){
  const wasConfirmed=!!App.room.confirmed;
  const idxs=w.idxs;
  const attendees=attendeesForIdxs(App.people,idxs).map(p=>({name:p.name,title:p.title}));
  App.room.confirmed={date:w.date,start:w.start,end:w.end,attendees};
  App._changeMode=null;
  await Store.setRoom(App.code,App.room);
  closeSheet();render();
  if(!getConfetti(App.code).confirmed){setConfettiFlag(App.code,'confirmed');fireConfetti();}
  toast(wasConfirmed?'일정을 변경했어요 ✅':'일정을 확정했어요 🎉');
}
/* 확정/변경 공통 피커: TOP3 중에서 고르거나, 직접 날짜·시간을 골라요.
   title/actionLabel만 다르게 줘서 "확정"과 "변경" 양쪽에 같이 써요. */
function openSchedulePicker(title,actionLabel){
  const room=App.room;
  const {top}=computeTop3(room,App.people);
  App._top3=top;
  const opts= top.map((w,i)=>`<button class="btn btn-ghost" style="text-align:left;height:auto;white-space:normal;display:block;" data-act="doConfirm" data-i="${i}">
      <div style="font-weight:700;">${w.rank}순위 · ${dateLabel(w.date)} ${minToHHMM(w.start)}~${minToHHMM(w.end)}</div>
      <div class="muted" style="margin-top:3px;font-weight:400;">참여: ${esc(attendeeNamesText(room,App.people,w.idxs))}</div>
    </button>`).join('');
  const wl=windowLenOf(room),cpd=cellsPerDayOf(room);
  let startOpts='';
  for(let s=0;s+wl<=cpd;s++){ const t=room.timeStart+s*room.unit; startOpts+=`<option value="${t}">${minToHHMM(t)}~${minToHHMM(t+wl*room.unit)}</option>`; }
  openSheet(`<h3>${esc(title)}</h3>
    ${opts||'<div class="muted">추천 결과가 없어요</div>'}
    <hr class="sep">
    <div class="sectitle">또는 직접 선택</div>
    <div class="row">
      <select id="manualDate">${room.dates.map(d=>`<option value="${d}">${dateLabel(d)}</option>`).join('')}</select>
      <select id="manualStart">${startOpts}</select>
    </div>
    <div id="manualPreview" class="muted" style="margin-top:6px;"></div>
    <button class="btn btn-ghost" data-act="doConfirmManual">${esc(actionLabel)}</button>
    <button class="btn-text" data-act="closeSheet">닫기</button>`);
  const manualIdxs=()=>{
    const date=$('#manualDate').value,start=+$('#manualStart').value;
    const dIdx=room.dates.indexOf(date),s=(start-room.timeStart)/room.unit;
    const idxs=[];for(let k=0;k<wl;k++)idxs.push(dIdx*cpd+s+k);
    return idxs;
  };
  const updatePreview=()=>{ $('#manualPreview').textContent='참여: '+attendeeNamesText(room,App.people,manualIdxs()); };
  $('#manualDate').onchange=updatePreview;
  $('#manualStart').onchange=updatePreview;
  updatePreview();
}
function openSheet(html){
  closeSheet();
  const ov=document.createElement('div');ov.className='overlay';ov.id='overlay';
  ov.innerHTML=`<div class="sheet">${html}</div>`;
  ov.onclick=(e)=>{if(e.target===ov)closeSheet();};
  document.body.appendChild(ov);
}
function closeSheet(){const o=$('#overlay');if(o)o.remove();}
function askPassword(onOk){
  openSheet(`<h3>방장 비밀번호</h3>
    <input type="password" id="pwInput" class="field" style="border:1px solid var(--line-strong);background:var(--bg-elev);color:var(--ink);border-radius:8px;padding:11px 12px;">
    <div id="pwErr" class="err"></div>
    <button class="btn btn-primary" id="pwOk">확인</button>
    <button class="btn-text" data-act="closeSheet">취소</button>`);
  $('#pwOk').onclick=async()=>{
    const v=$('#pwInput').value;
    const h=await sha256Hex(v);
    if(h===App.room.pwHash){onOk();}
    else $('#pwErr').textContent='비밀번호가 올바르지 않아요.';
  };
}
function openSettingsSheet(){
  const room=App.room;const locked=App.people.length>0;
  const peopleToggles=App.people.map(p=>{
    const isManager=room.manager && room.manager.name===p.name && room.manager.title===p.title;
    const on=isReqPerson(room,p);
    return `<button type="button" class="chip reqToggle ${on?'on':''}" data-name="${esc(p.name)}" data-title="${esc(p.title)}" ${isManager?'disabled':''} data-act="${isManager?'':'toggleReqPerson'}">${esc(p.name)} · ${esc(p.title)}${isManager?' (담당자)':''}</button>`;
  }).join('');
  openSheet(`<h3>방 설정 수정</h3>
    <div class="field"><label>모임 이름</label><input type="text" id="s_name" value="${esc(room.name)}"></div>
    <div class="field"><label>세부내용</label><input type="text" id="s_details" value="${esc(room.details||'')}"></div>
    <div class="field"><label>총 인원</label><input type="number" id="s_total" min="${Math.max(room.required.length,App.people.length)}" value="${room.totalCount}"></div>
    <div class="field"><label>최소 참석 인원 <span style="font-weight:400;color:var(--ink-faint);">비우면 과반</span></label><input type="number" id="s_min" min="1" placeholder="자동 (과반)" value="${room.minCount==null?'':room.minCount}"></div>
    <div class="field"><label>시작 시각 ${locked?'(입력자가 있어 수정 불가)':''}</label><select id="s_tstart" ${locked?'disabled':''}>${timeOptions(room.timeStart)}</select></div>
    <div class="field"><label>시간 단위 ${locked?'(입력자가 있어 수정 불가)':''}</label><select id="s_unit" ${locked?'disabled':''}>${(room.unit===45?[15,30,45,60]:[15,30,60]).map(u=>`<option value="${u}" ${room.unit===u?'selected':''}>${u}분</option>`).join('')}</select></div>
    <div class="field">
      <label>필참자 (링크로 들어온 사람 중 선택)</label>
      <div style="display:flex;flex-direction:column;">
        ${peopleToggles||'<div class="muted">아직 들어온 사람이 없어요. 링크로 들어오면 여기서 필참으로 지정할 수 있어요.</div>'}
      </div>
    </div>
    <div class="field">
      <label>투표 마감</label>
      <div class="row">
        <input type="date" id="s_deadline" min="${todayISO()}" value="${(room.deadline&&room.deadline.mode!=='none'&&room.deadline.value)?room.deadline.value.slice(0,10):defaultDeadline()}" ${(room.deadline&&room.deadline.mode!=='none')?'':'disabled'} style="flex:1;border:1px solid var(--line-strong);background:var(--bg-elev);color:var(--ink);border-radius:var(--radius-sm);padding:11px 12px;">
        <label class="row" style="gap:4px;font-size:13px;font-weight:500;white-space:nowrap;"><input type="checkbox" id="s_noDeadline" ${(room.deadline&&room.deadline.mode!=='none')?'':'checked'} onchange="document.getElementById('s_deadline').disabled=this.checked"> 마감 없음</label>
      </div>
      <div class="muted">선택한 날 밤 23:59까지 입력할 수 있어요. 마감이 지난 방도 날짜를 늦추면 다시 열려요.</div>
    </div>
    <div class="field"><label>새 비밀번호 (변경 시에만 입력)</label><input type="password" id="s_pw"></div>
    <div id="setErr" class="err"></div>
    <button class="btn btn-primary" data-act="saveSettings">저장</button>
    <button class="btn-text" data-act="closeSheet">취소</button>`);
}
globalActions.saveSettings=async()=>{
  const room=App.room;
  const name=$('#s_name').value.trim();
  const total=+$('#s_total').value;
  const errEl=$('#setErr');
  if(!name){errEl.textContent='모임 이름을 입력해주세요.';return;}
  if(total<Math.max(room.required.length,App.people.length)){errEl.textContent='총 인원이 너무 적어요.';return;}
  const noDl=$('#s_noDeadline').checked;
  const dlVal=$('#s_deadline').value;
  if(!noDl){
    if(!dlVal){errEl.textContent='투표 마감일을 선택해주세요.';return;}
    if(cmpDate(dlVal,todayISO())<0){errEl.textContent='투표 마감일이 오늘보다 이전이에요.';return;}
  }
  const newPwCheck=$('#s_pw').value;
  if(newPwCheck && newPwCheck.length<4){errEl.textContent='새 비밀번호는 4자 이상이어야 해요.';return;}
  room.deadline= noDl?{mode:'none',value:null}:{mode:'manual',value:dlVal};
  room.name=name;room.details=$('#s_details').value;room.totalCount=total;
  { const mv=($('#s_min')||{}).value; room.minCount=(mv===''||mv==null)?null:Math.min(total,Math.max(1,parseInt(mv,10)||1)); }
  if(!App.people.length){room.timeStart=+$('#s_tstart').value;room.unit=+$('#s_unit').value;}
  /* 필참자 갱신: 담당자는 항상 유지, 직급전용 항목은 그대로 두고,
     링크로 들어온 사람 토글칩 선택 결과를 이름 지정 항목으로 반영해요. */
  const titleOnly=room.required.filter(r=>r.type==='title');
  const managerReq={type:'name',name:room.manager.name,title:room.manager.title};
  const checked=$$('.reqToggle.on').map(c=>({type:'name',name:c.getAttribute('data-name'),title:c.getAttribute('data-title')}));
  const seen=new Set([managerReq.name+'|'+managerReq.title]);
  const nameReqs=[managerReq];
  checked.forEach(r=>{ const k=r.name+'|'+r.title; if(!seen.has(k)){seen.add(k);nameReqs.push(r);} });
  /* 아직 방에 들어오지 않은 이름 지정 필참자는 체크박스가 없으니, 지우지 말고 그대로 유지해요 */
  room.required.filter(r=>r.type==='name'&&!reqJoined(r,App.people)).forEach(r=>{ const k=r.name+'|'+r.title; if(!seen.has(k)){seen.add(k);nameReqs.push(r);} });
  room.required=[...nameReqs,...titleOnly];
  const newPw=$('#s_pw').value;
  if(newPw){ if(newPw.length<4){errEl.textContent='새 비밀번호는 4자 이상이어야 해요.';return;} room.pwHash=await sha256Hex(newPw); }
  await Store.setRoom(App.code,room);
  closeSheet();render();toast('설정을 저장했어요');
};

/* ---------- 그리드 상호작용 (저장, 드래그) ---------- */
function afterRoomRender(){
  const grid=$('#gridWrap');
  if(grid && App.draft && App.draft.pendingCells){
    let painting=false,paintVal=null;
    const dragOn=()=>$('#dragToggle')&&$('#dragToggle').checked;
    function setCell(idx,val){App.draft.pendingCells[idx]=val?'1':'0';const c=$(`.cell[data-idx="${idx}"]`,grid);if(c)c.classList.toggle('on',val);}
    grid.onmousedown=(e)=>{const c=e.target.closest('.cell');if(!c)return;painting=true;const idx=+c.getAttribute('data-idx');paintVal=App.draft.pendingCells[idx]!=='1';setCell(idx,paintVal);};
    grid.onmouseover=(e)=>{if(!painting)return;const c=e.target.closest('.cell');if(!c)return;setCell(+c.getAttribute('data-idx'),paintVal);};
    window.onmouseup=()=>{painting=false;};
    grid.ontouchstart=(e)=>{
      const c=e.target.closest('.cell');if(!c)return;
      const idx=+c.getAttribute('data-idx');
      if(dragOn()){painting=true;paintVal=App.draft.pendingCells[idx]!=='1';setCell(idx,paintVal);e.preventDefault();}
      else{setCell(idx,App.draft.pendingCells[idx]!=='1');}
    };
    grid.ontouchmove=(e)=>{
      if(!painting||!dragOn())return;
      e.preventDefault();
      const t=e.touches[0];const el=document.elementFromPoint(t.clientX,t.clientY);
      const c=el&&el.closest('.cell');if(!c)return;
      setCell(+c.getAttribute('data-idx'),paintVal);
    };
    grid.ontouchend=()=>{painting=false;};
    const dt=$('#dragToggle');if(dt)dt.onchange=e=>LS.set('cimo:dragToggle',e.target.checked);
    if(App.room.timeStart===0){
      const rowH=26;const target=Math.max(0,(9*60-App.room.timeStart)/App.room.unit*rowH-40);
      grid.scrollTop=target;
    }
  }
}

/* ---------- 컨페티 ---------- */
function fireConfetti(){
  if(reduceMotion())return;
  const host=$('#confetti-canvas');host.innerHTML='';
  const canvas=document.createElement('canvas');host.appendChild(canvas);
  canvas.width=innerWidth;canvas.height=innerHeight;
  const ctx=canvas.getContext('2d');
  const colors=['#FF6A2B','#D9A62A','#2F9E5B','#4F8DD9','#D94F4F'];
  let parts=Array.from({length:110},()=>({x:Math.random()*canvas.width,y:-20-Math.random()*200,vx:(Math.random()-0.5)*4,vy:2+Math.random()*3,r:4+Math.random()*4,c:colors[Math.floor(Math.random()*colors.length)],rot:Math.random()*360,vr:(Math.random()-0.5)*10}));
  let f=0;
  (function tick(){
    f++;ctx.clearRect(0,0,canvas.width,canvas.height);
    parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);ctx.restore();});
    if(f<140)requestAnimationFrame(tick);else host.innerHTML='';
  })();
}

async function init(){
  applyTheme();
  await initCaps();
  await seedDemo();
  const m=location.hash.match(/room=(\d{6})/);
  if(m){
    /* 초대 링크로 들어온 경우: 브랜드 스플래시로 붙잡지 않고 바로 투표 화면으로 — 
       한 번이라도 더 끊기면 그만큼 안 들어오고 이탈할 수 있어서, 여기는 0초가 맞아요. */
    $('#splash').style.display='none';
    await openRoom(m[1]);
    return;
  }
  const skip=reduceMotion();
  setTimeout(async()=>{ $('#splash').style.display='none'; await goHomeScreen(); }, skip?600:2400);
}
init();
